name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project SampIOS.xcodeproj \
            -scheme SampIOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/SampIOS.app package/Payload/
          ditto -c -k --sequesterRsrc --keepParent package/Payload package/SampIOS-unsigned.ipa

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samp-ios-build
          path: |
            build/Build/Products/Release-iphoneos/SampIOS.app
            package/SampIOS-unsigned.ipa
