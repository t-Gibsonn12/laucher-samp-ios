name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run launcher protocol tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$SIMULATOR_ID"
          xcodebuild \
            -project SampIOS.xcodeproj \
            -scheme SampIOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project SampIOS.xcodeproj \
            -scheme SampIOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/SampIOS.app package/Payload/
          ditto -c -k --sequesterRsrc --keepParent package/Payload package/SampIOS-unsigned.ipa

      - name: Validate IPA structure
        run: |
          plutil -lint SampIOS/Resources/Info.plist
          unzip -t package/SampIOS-unsigned.ipa
          unzip -l package/SampIOS-unsigned.ipa | grep -q 'Payload/SampIOS.app/Info.plist'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samp-ios-build
          path: |
            build/Build/Products/Release-iphoneos/SampIOS.app
            package/SampIOS-unsigned.ipa
